<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="应用索引">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>应用索引 · sunnylegrand</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0c0c0d; color: #f2f2f3; min-height: 100vh;
    padding: calc(28px + env(safe-area-inset-top)) 20px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .sub { margin-top: 6px; font-size: 14px; color: #9a9aa0; }
  .app {
    display: flex; align-items: center; gap: 16px;
    background: #17181a; border: 1px solid #26272b; border-radius: 18px;
    padding: 18px; text-decoration: none; color: inherit;
    transition: transform .12s ease, border-color .12s ease;
  }
  .app:active { transform: scale(.985); border-color: #3a3b41; }
  .icon {
    flex: 0 0 auto; width: 58px; height: 58px; border-radius: 14px;
    background: linear-gradient(135deg, #f59e0b, #ef4444 55%, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .meta { flex: 1 1 auto; min-width: 0; }
  .name { font-size: 18px; font-weight: 600; }
  .desc { margin-top: 4px; font-size: 13px; line-height: 1.5; color: #9a9aa0; }
  .go { flex: 0 0 auto; font-size: 14px; color: #6ea8fe; }
  footer { margin-top: 34px; font-size: 12px; color: #5c5d63; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>应用索引</h1>
      <p class="sub">我开发的小工具都在这里，新 App 会陆续加上。</p>
    </header>

    <a class="app" href="coloright-info/">
      <div class="icon">C</div>
      <div class="meta">
        <div class="name">ColoRight</div>
        <div class="desc">修图工具：手机网页版打开即用；桌面版带本地 AI（抠图、生成背景、消除重绘、美化、放大）。点开看详细说明、模型清单与下载。</div>
      </div>
      <div class="go">详情 →</div>
    </a>

    <a class="app" href="easyedit-info/" style="margin-top:14px">
      <div class="icon" style="background:linear-gradient(135deg,#06b6d4,#3b82f6 55%,#8b5cf6)">E</div>
      <div class="meta">
        <div class="name">EasyEdit</div>
        <div class="desc">手机剪辑：多素材拼接、裁剪分割、提取音频，导出成片。点开看详细说明与代码下载。</div>
      </div>
      <div class="go">详情 →</div>
    </a>

    <footer>托管于 GitHub Pages</footer>
  </div>
</body>
</html>
